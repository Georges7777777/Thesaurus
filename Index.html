<style>
  :root{
    --encre:#33353A;
    --papier:#FCFBF8;
    --filet:#D5D0C6;
    --filet-clair:#E8E4DC;
    --doux:#7E786E;
    --cerise:#C0223C;
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --marge: 22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--papier); color:var(--encre);
    font-family:var(--sans);
    font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;}
  input{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--cerise); outline-offset:3px;}

  /* ---------------- Page de garde ---------------- */
  #garde{
    position:fixed; inset:0; z-index:50; background:var(--papier);
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:0;
    padding:calc(env(safe-area-inset-top) + 28px) var(--marge)
            calc(env(safe-area-inset-bottom) + 28px);
    text-align:center; overflow:auto;
  }
  #garde.parti{display:none;}
  .garde-logo{width:min(300px,74vw); height:auto; display:block;}
  .garde-portrait{
    width:min(224px,52vw); height:auto; display:block;
    margin:6px 0 2px;
  }
  .garde-nom{
    font-family:var(--serif); font-weight:400;
    font-size:clamp(26px,7.6vw,34px); line-height:1.15;
    letter-spacing:.005em; margin:10px 0 0;
  }
  .garde-sous{
    font-size:14px; color:var(--doux); margin:10px 0 0; max-width:26ch;
  }
  /* filet gravé, écho du trait du logo */
  .filet-grave{
    width:92px; height:5px; margin:20px 0 0;
    border-top:1px solid var(--encre);
    border-bottom:1px solid var(--encre);
    opacity:.5;
  }
  .garde-entrer{
    margin-top:26px; padding:13px 30px;
    font-family:var(--serif); font-size:17px;
    border:1px solid var(--encre); border-radius:2px;
    background:var(--encre); color:var(--papier);
  }
  .garde-entrer:active{opacity:.75;}

  /* ---------------- En-tête ---------------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--papier);
    padding:calc(env(safe-area-inset-top) + 12px) var(--marge) 0;
    border-bottom:1px solid var(--filet-clair);
  }
  .barre{display:flex; align-items:center; gap:11px; min-height:34px;}
  .vignette{
    width:34px; height:34px; border-radius:50%; flex:0 0 auto;
    background:#fff center 12% / 170% no-repeat;
    border:1px solid var(--filet);
  }
  .enseigne{
    font-family:var(--serif); font-size:17px; line-height:1.2;
    flex:1 1 auto; min-width:0;
  }
  .enseigne small{display:block; font-family:var(--sans); font-size:11.5px; color:var(--doux);}
  .retour{
    font-size:15px; color:var(--cerise); padding:6px 2px 6px 0; flex:0 0 auto;
  }
  .champ{position:relative; margin:12px 0 13px;}
  .champ input{
    width:100%; padding:11px 38px 11px 13px;
    background:#fff; border:1px solid var(--filet); border-radius:3px;
    font-size:16px;
  }
  .champ input::placeholder{color:#A9A399;}
  /* Safari ajoute sa propre croix : on garde la nôtre, mieux placée */
  .champ input::-webkit-search-cancel-button,
  .champ input::-webkit-search-decoration{-webkit-appearance:none; display:none;}
  .champ input:focus{outline:none; border-color:var(--encre);}
  .champ input:focus-visible{outline:none; border-color:var(--cerise);
    box-shadow:0 0 0 1px var(--cerise);}
  .effacer{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; color:var(--doux); font-size:17px; line-height:1;
    display:none;
  }
  .champ.rempli .effacer{display:block;}

  /* ---------------- Contenu ---------------- */
  main{
    padding:0 var(--marge) calc(env(safe-area-inset-bottom) + 56px);
    max-width:760px; margin:0 auto;
  }
  .titre-section{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; margin:26px 0 2px; padding-bottom:7px;
    border-bottom:1px solid var(--encre);
  }
  .titre-section h2{
    font-family:var(--serif); font-weight:400; font-size:18px; margin:0;
  }
  .titre-section span{font-size:12.5px; color:var(--doux); flex:0 0 auto;}

  ul.liste{list-style:none; margin:0; padding:0;}
  ul.liste li{border-bottom:1px solid var(--filet-clair);}

  /* rangée volume */
  .vol{
    display:flex; gap:15px; align-items:baseline;
    width:100%; text-align:left; padding:13px 0;
  }
  .vol-num{
    font-family:var(--serif); font-size:19px; color:var(--doux);
    flex:0 0 2.6ch; text-align:right; font-variant-numeric:tabular-nums;
  }
  .vol-corps{flex:1 1 auto; min-width:0; display:block;}
  .vol-titre{display:block; font-family:var(--serif); font-size:17px; line-height:1.3;}
  .vol-compte{display:block; font-size:12.5px; color:var(--doux); margin-top:2px;}
  .chev{flex:0 0 auto; color:var(--filet); font-size:19px; align-self:center;}

  /* rangée recette */
  .rec{padding:12px 0 13px; display:block; width:100%; text-align:left;}
  .rec-titre{display:block; font-family:var(--serif); font-size:16.5px; line-height:1.32;}
  .rec-loc{display:block; font-size:12.5px; color:var(--doux); margin-top:3px;}
  .rec-corps{display:block;}
  .rec-cat{font-weight:600;}
  .rec .page{
    font-variant-numeric:tabular-nums; color:var(--doux);
    font-family:var(--serif); font-size:15px;
    flex:0 0 3.2ch; text-align:right;
  }
  .rec-en-vol{display:flex; gap:15px; align-items:baseline;}
  .rec-en-vol .rec-corps{flex:1 1 auto; min-width:0;}

  mark{
    background:none; color:inherit;
    box-shadow:inset 0 -0.42em 0 rgba(192,34,60,.15);
    border-bottom:1px solid rgba(192,34,60,.55);
  }

  /* fiche volume */
  .fiche{padding:24px 0 4px; border-bottom:1px solid var(--encre); margin-bottom:2px;}
  .fiche-num{
    font-family:var(--serif); font-size:13px; color:var(--doux);
    letter-spacing:.06em;
  }
  .fiche-titre{
    font-family:var(--serif); font-weight:400; font-size:27px;
    line-height:1.16; margin:4px 0 9px;
  }
  .fiche-meta{font-size:13px; color:var(--doux); padding-bottom:14px;}

  .vide{
    padding:38px 0 10px; color:var(--doux); font-size:14.5px;
    max-width:34ch; line-height:1.6;
  }
  .vide b{color:var(--encre); font-weight:600;}

  .pied{
    margin-top:34px; padding-top:16px; border-top:1px solid var(--filet-clair);
    font-size:12px; color:var(--doux); line-height:1.6;
  }
  .pied button{color:var(--cerise); font-size:12px; padding:0;}

  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important;}}
  /* iPhone SE et autres écrans courts : tout doit tenir sans défiler */
  @media (max-height:700px){
    .garde-logo{width:min(230px,60vw);}
    .garde-portrait{width:min(150px,38vw); margin:2px 0 0;}
    .garde-nom{font-size:24px; margin-top:6px;}
    .filet-grave{margin-top:12px;}
    .garde-sous{font-size:13px; margin-top:8px;}
    .garde-entrer{margin-top:16px; padding:11px 26px;}
  }
  @media (min-width:700px){
    :root{--marge:34px;}
    .garde-portrait{width:250px;}
  }
</style>
</head>

var COULEURS = {
  "Entrée":"#2B4C7E", "Plat":"#9B2C3B", "Dessert":"#8A3A63",
  "Conserve":"#4A6B4F", "Boisson":"#A0572B", "Accompagnement":"#4A6B4F",
  "Article":"#6C6560"
};

/* ---------- index de recherche ---------- */
/* « œufs » et « oeufs » doivent trouver la même chose : la ligature
   n'est pas décomposée par la normalisation Unicode, on la remplace. */
function pliage(s){
  return (s || "").toString().toLowerCase()
    .replace(/œ/g, "oe").replace(/æ/g, "ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[’']/g, " ").replace(/[^a-z0-9]+/g, " ").trim();
}
var TITRE_VOL = {};
VOLUMES.forEach(function(v){ TITRE_VOL[v.n] = v.t; v._i = pliage(v.t); });
RECETTES.forEach(function(r){ r._i = pliage(r.t + " " + r.m); r._t = pliage(r.t); });

var COMPTES = {};
RECETTES.forEach(function(r){ COMPTES[r.v] = (COMPTES[r.v] || 0) + 1; });

/* ---------- utilitaires ---------- */
function ech(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
/* surligne les mots trouvés, en tenant compte des accents */
function souligner(texte, mots){
  if(!mots.length) return ech(texte);
  var plie = pliage(texte), brut = texte;
  /* carte position pliée -> position brute */
  var carte = [], p = 0;
  for(var i=0; i<brut.length; i++){
    var c = pliage(brut[i]);
    if(c.length){ carte[p] = i; p += c.length; }
    else if(p > 0 && carte[p-1] !== undefined && plie[p] === " "){ carte[p] = i; p++; }
  }
  carte[p] = brut.length;
  var zones = [];
  mots.forEach(function(m){
    var d = 0, k;
    while(m && (k = plie.indexOf(m, d)) !== -1){
      if(k === 0 || plie[k-1] === " ") zones.push([k, k + m.length]);
      d = k + 1;
    }
  });
  if(!zones.length) return ech(texte);
  zones.sort(function(a,b){ return a[0]-b[0]; });
  var fusion = [zones[0]];
  for(var j=1; j<zones.length; j++){
    var d2 = fusion[fusion.length-1];
    if(zones[j][0] <= d2[1]) d2[1] = Math.max(d2[1], zones[j][1]);
    else fusion.push(zones[j]);
  }
  var out = "", pos = 0;
  fusion.forEach(function(z){
    var a = carte[z[0]], b = carte[z[1]];
    if(a === undefined) return;
    if(b === undefined) b = brut.length;
    out += ech(brut.slice(pos, a)) + "<mark>" + ech(brut.slice(a, b)) + "</mark>";
    pos = b;
  });
  return out + ech(brut.slice(pos));
}
function pastille(cat){
  var c = COULEURS[cat] || "var(--doux)";
  return '<span class="rec-cat" style="color:' + c + '">' + ech(cat) + "</span>";
}
function pluriel(n, mot){ return n + " " + mot + (n > 1 ? "s" : ""); }

var vue = document.getElementById("vue");

/* ---------- rendus ---------- */
function rendreVolumes(){
  var h = '<div class="titre-section"><h2>Les 110 volumes</h2><span>'
        + RECETTES.length.toLocaleString("fr-FR") + " recettes</span></div><ul class=\"liste\">";
  VOLUMES.forEach(function(v){
    h += '<li><button class="vol" data-vol="' + v.n + '">'
       +   '<span class="vol-num">' + v.n + "</span>"
       +   '<span class="vol-corps"><span class="vol-titre">' + ech(v.t) + "</span>"
       +     '<span class="vol-compte">' + pluriel(COMPTES[v.n] || 0, "recette") + "</span></span>"
       +   '<span class="chev" aria-hidden="true">›</span>'
       + "</button></li>";
  });
  h += "</ul>" + pied();
  vue.innerHTML = h;
}

function rendreVolume(n){
  var v = VOLUMES.find(function(x){ return x.n === n; });
  var liste = RECETTES.filter(function(r){ return r.v === n; });
  var h = '<div class="fiche"><div class="fiche-num">Volume ' + n + " sur 110</div>"
        + '<h2 class="fiche-titre">' + ech(v.t) + "</h2>"
        + '<div class="fiche-meta">' + pluriel(liste.length, "recette")
        + ", pages " + liste[0].p + " à " + liste[liste.length-1].p + "</div></div><ul class=\"liste\">";
  liste.forEach(function(r){
    h += '<li><div class="rec rec-en-vol">'
       +   '<span class="page">' + r.p + "</span>"
       +   '<span class="rec-corps"><span class="rec-titre">' + ech(r.t) + "</span>"
       +     '<span class="rec-loc">' + pastille(r.c)
       +       (r.m ? " — " + ech(r.m) : "") + "</span></span>"
       + "</div></li>";
  });
  h += "</ul>" + pied();
  vue.innerHTML = h;
  window.scrollTo(0, 0);
}

function rendreRecherche(q){
  var mots = pliage(q).split(" ").filter(Boolean);
  if(!mots.length){ etat.vue = "volumes"; rendreVolumes(); return; }

  var vols = VOLUMES.filter(function(v){
    return mots.every(function(m){ return v._i.indexOf(m) !== -1; });
  });
  var recs = RECETTES.filter(function(r){
    return mots.every(function(m){ return r._i.indexOf(m) !== -1; });
  });
  /* les titres qui commencent par la recherche d'abord */
  recs.sort(function(a, b){
    var pa = a._t.indexOf(mots[0]), pb = b._t.indexOf(mots[0]);
    var sa = pa === 0 ? 0 : (pa > 0 ? 1 : 2), sb = pb === 0 ? 0 : (pb > 0 ? 1 : 2);
    if(sa !== sb) return sa - sb;
    return a.v - b.v || a.p - b.p;
  });

  var h = "";
  if(vols.length){
    h += '<div class="titre-section"><h2>Volumes</h2><span>'
       + pluriel(vols.length, "titre") + "</span></div><ul class=\"liste\">";
    vols.forEach(function(v){
      h += '<li><button class="vol" data-vol="' + v.n + '">'
         +   '<span class="vol-num">' + v.n + "</span>"
         +   '<span class="vol-corps"><span class="vol-titre">' + souligner(v.t, mots) + "</span>"
         +     '<span class="vol-compte">' + pluriel(COMPTES[v.n] || 0, "recette") + "</span></span>"
         +   '<span class="chev" aria-hidden="true">›</span>'
         + "</button></li>";
    });
    h += "</ul>";
  }
  if(recs.length){
    var trop = recs.length > 300;
    var montre = trop ? recs.slice(0, 300) : recs;
    h += '<div class="titre-section"><h2>Recettes</h2><span>'
       + pluriel(recs.length, "recette") + "</span></div><ul class=\"liste\">";
    montre.forEach(function(r){
      h += '<li><button class="rec" data-vol="' + r.v + '">'
         +   '<span class="rec-titre">' + souligner(r.t, mots) + "</span>"
         +   '<span class="rec-loc">Volume ' + r.v + ", page " + r.p + " — "
         +     ech(TITRE_VOL[r.v]) + ". " + pastille(r.c)
         +     (r.m ? " — " + souligner(r.m, mots) : "") + "</span>"
         + "</button></li>";
    });
    h += "</ul>";
    if(trop){
      h += '<p class="vide">Seules les 300 premières sont affichées. Précisez la recherche pour resserrer la liste.</p>';
    }
  }
  if(!vols.length && !recs.length){
    h += '<p class="vide">Rien pour <b>' + ech(q) + "</b>.<br>"
       + "La recherche porte sur les titres de volumes, les titres de recettes "
       + "et les ingrédients principaux. Essayez un mot plus court, "
       + "ou le singulier.</p>";
  }
  vue.innerHTML = h + pied();
}

function pied(){
  return '<div class="pied">110 volumes, ' + RECETTES.length.toLocaleString("fr-FR")
       + " recettes. Collection Hachette « Mes délicieuses recettes de grand-mère ».<br>"
       + '<button id="revoirGarde">Revoir la page de garde</button></div>';
}

/* ---------- navigation ---------- */
function afficher(){
  retour.hidden = etat.vue !== "volume";
  if(etat.vue === "volume"){
    sous.textContent = "Volume " + etat.volume;
    rendreVolume(etat.volume);
  } else if(etat.vue === "recherche"){
    sous.textContent = "Recherche";
    rendreRecherche(etat.q);
  } else {
    sous.textContent = "110 volumes, " + RECETTES.length.toLocaleString("fr-FR") + " recettes";
    rendreVolumes();
  }
}

document.getElementById("entrer").addEventListener("click", function(){
  document.getElementById("garde").classList.add("parti");
});
retour.addEventListener("click", function(){
  etat.vue = etat.q ? "recherche" : "volumes";
  afficher();
  window.scrollTo(0, 0);
});

vue.addEventListener("click", function(e){
  var b = e.target.closest("[data-vol]");
  if(b){
    etat.vue = "volume";
    etat.volume = parseInt(b.getAttribute("data-vol"), 10);
    afficher();
    return;
  }
  if(e.target.id === "revoirGarde"){
    document.getElementById("garde").classList.remove("parti");
    window.scrollTo(0, 0);
  }
});

var champ = document.getElementById("champ");
var minuteur;
champQ.addEventListener("input", function(){
  champ.classList.toggle("rempli", champQ.value.length > 0);
  clearTimeout(minuteur);
  minuteur = setTimeout(function(){
    etat.q = champQ.value.trim();
    etat.vue = etat.q ? "recherche" : "volumes";
    afficher();
    window.scrollTo(0, 0);
  }, 130);
});
champQ.addEventListener("keydown", function(e){
  if(e.key === "Enter") champQ.blur();
});
document.getElementById("effacer").addEventListener("click", function(){
  champQ.value = "";
  champ.classList.remove("rempli");
  etat.q = ""; etat.vue = "volumes";
  afficher();
  champQ.focus();
});
